name: Sonar PR 173 Public Probe

on:
  pull_request:
    paths:
      - '.github/workflows/sonar-pr173-public-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query public SonarQube Cloud API surface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sonar-probe
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          out = Path('/tmp/sonar-probe')
          base = 'https://sonarcloud.io/api/'
          calls = {
              'quality_gate_pr173': ('qualitygates/project_status', {
                  'projectKey': 'setoxxx_nycif-national-pilot',
                  'pullRequest': '173',
              }),
              'issues_pr173': ('issues/search', {
                  'componentKeys': 'setoxxx_nycif-national-pilot',
                  'pullRequest': '173',
                  'ps': '100',
              }),
              'issues_pr172_control': ('issues/search', {
                  'componentKeys': 'setoxxx_nycif-national-pilot',
                  'pullRequest': '172',
                  'ps': '100',
              }),
              'quality_gate_pr154': ('qualitygates/project_status', {
                  'projectKey': 'setoxxx_nycif-national-pilot',
                  'pullRequest': '154',
              }),
              'issues_pr154': ('issues/search', {
                  'componentKeys': 'setoxxx_nycif-national-pilot',
                  'pullRequest': '154',
                  'ps': '100',
              }),
          }

          result = {
              'purpose': 'read-only public Sonar API comparison for private national-pilot PRs',
              'candidate_sha': '7060cf6733d9bd206ca78e3c279c85434fb3c024',
              'candidate_pr': 173,
              'known-finding-control_pr': 172,
              'historical_comparator_pr': 154,
              'calls': {},
          }

          for key, (path, params) in calls.items():
              url = base + path + '?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={'User-Agent': 'NYCIF-Sonar-Public-Probe/1.0'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      text = response.read().decode('utf-8', 'replace')
                      try:
                          data = json.loads(text)
                      except json.JSONDecodeError:
                          data = {'raw_text': text[:4000]}
                      result['calls'][key] = {
                          'http_status': response.status,
                          'data': data,
                      }
              except urllib.error.HTTPError as exc:
                  text = exc.read().decode('utf-8', 'replace')
                  result['calls'][key] = {
                      'http_status': exc.code,
                      'error_body': text[:4000],
                  }
              except Exception as exc:
                  result['calls'][key] = {
                      'transport_error': type(exc).__name__,
                      'message': str(exc),
                  }

          (out / 'sonar-pr173-public-probe.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-pr173-public-probe-${{ github.sha }}
          path: /tmp/sonar-probe/sonar-pr173-public-probe.json
          if-no-files-found: error
          retention-days: 7
